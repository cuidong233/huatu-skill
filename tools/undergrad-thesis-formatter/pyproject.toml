[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undergrad-thesis-formatter"
version = "0.1.0"
description = "A local DOCX formatter for undergraduate thesis templates."
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.2"
]

[project.scripts]
thesis-format = "thesis_formatter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
